name: Release

# Push a tag matching v* (e.g. v1.1.0 — keep it in sync with package.json's
# "version") to build all three platforms and publish a GitHub Release with
# every artifact attached. `workflow_dispatch` lets you re-run the same
# build manually (e.g. to retry a flaky platform) without pushing a new tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # electron-builder needs this to create the release and upload assets

jobs:
  # electron-builder determines the release to publish to from package.json's
  # "version", not from whatever git ref triggered the run — so re-running
  # this workflow (workflow_dispatch, or a retried job) for the same version
  # targets the *same* release the previous attempt already uploaded assets
  # to. electron-builder does try to overwrite existing assets, but that's
  # been flaky for at least one file per run (a 422 "already_exists" on a
  # .blockmap that a previous attempt had already published) — deleting any
  # existing release for this version up front, once, before the matrix
  # fans out, means every build starts from a guaranteed-clean release
  # instead of relying on that overwrite path at all.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version from package.json
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Delete existing release for this version, if any
        run: gh release delete "${{ steps.version.outputs.tag }}" --yes --cleanup-tag=false || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # AppImage's build step (not just running one) needs libfuse2 on
      # modern Ubuntu runners, which dropped it from the base image.
      - name: Install AppImage build dependency (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      # Root and renderer installs run as two separate, sequential steps —
      # not root's postinstall spawning renderer's install as a nested
      # child process. On windows-latest that nesting reliably hit EPERM
      # errors cleaning up node_modules (Windows Defender holding a lock on
      # files a still-running parent npm process was also touching); giving
      # each npm process its own step means the first fully exits, releasing
      # every handle, before the second one starts.
      - name: Install root dependencies
        run: npm install

      - name: Install renderer dependencies
        run: npm run install:renderer

      - name: Build and publish
        run: npm run dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned build — stop electron-builder from hunting for a local
          # code-signing identity on the mac runner's (empty) keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: false
