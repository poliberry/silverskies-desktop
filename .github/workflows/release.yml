name: Release

# Push a tag matching v* (e.g. v1.1.0 — keep it in sync with package.json's
# "version") to build all three platforms and publish a GitHub Release with
# every artifact attached. `workflow_dispatch` lets you re-run the same
# build manually (e.g. to retry a flaky platform) without pushing a new tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # electron-builder needs this to create the release and upload assets

# electron-builder publishes to whatever release matches package.json's
# version, regardless of which ref triggered the run — so two overlapping
# runs for the *same* version (a manual re-trigger while one's still
# building, say) would race on that one release. Serialize instead of
# canceling: a build already in flight should finish, not get yanked mid
# platform-matrix.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # Matches this platform's installer/portable exe, its
            # blockmap, and the differential-update metadata electron-
            # updater reads on Windows — never anything mac/Linux produce.
            assetPattern: "\\.exe(\\.blockmap)?$|^latest\\.yml$"
          - os: macos-latest
            assetPattern: "\\.(dmg|zip)(\\.blockmap)?$|^latest-mac\\.yml$"
          - os: ubuntu-latest
            assetPattern: "\\.(AppImage|deb)(\\.blockmap)?$|^latest-linux\\.yml$"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # electron-builder does try to overwrite an existing release asset on
      # a re-run, but that's been flaky (a mac .blockmap 422'd with
      # "already_exists" instead of being replaced) — so before building,
      # each job removes only *its own platform's* assets (by name pattern)
      # from any release already published for this version. Scoped to one
      # platform's filenames so the three matrix jobs never touch each
      # other's assets, and it lives in every job (not a separate "prepare"
      # job the matrix depends on) specifically because GitHub's "Re-run
      # failed jobs" skips already-succeeded jobs — a `needs:`-gated
      # one-time cleanup wouldn't run again on that kind of retry, and the
      # whole point here is that retries need to stay safe.
      - name: Remove this platform's stale release assets
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./package.json').version")"
          echo "Checking for an existing '$TAG' release..."

          if ! ASSETS_JSON=$(gh release view "$TAG" --json assets 2>err.log); then
            if grep -qi "release not found" err.log; then
              echo "No existing release for $TAG yet — nothing to clean up."
              exit 0
            fi
            echo "::error::Failed to look up the '$TAG' release:"
            cat err.log
            exit 1
          fi

          STALE=$(echo "$ASSETS_JSON" | node -e '
            const data = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const pattern = new RegExp(process.env.ASSET_PATTERN);
            for (const a of data.assets) if (pattern.test(a.name)) console.log(a.name);
          ')

          if [ -z "$STALE" ]; then
            echo "No stale assets matching this platform for $TAG."
            exit 0
          fi

          echo "$STALE" | while IFS= read -r name; do
            echo "Deleting stale asset from a previous attempt: $name"
            gh release delete-asset "$TAG" "$name" --yes
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_PATTERN: ${{ matrix.assetPattern }}

      # AppImage's build step (not just running one) needs libfuse2 on
      # modern Ubuntu runners, which dropped it from the base image.
      - name: Install AppImage build dependency (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      # Root and renderer installs run as two separate, sequential steps —
      # not root's postinstall spawning renderer's install as a nested
      # child process. On windows-latest that nesting reliably hit EPERM
      # errors cleaning up node_modules (Windows Defender holding a lock on
      # files a still-running parent npm process was also touching); giving
      # each npm process its own step means the first fully exits, releasing
      # every handle, before the second one starts.
      - name: Install root dependencies
        run: npm install

      - name: Install renderer dependencies
        run: npm run install:renderer

      - name: Build and publish
        run: npm run dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned build — stop electron-builder from hunting for a local
          # code-signing identity on the mac runner's (empty) keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: false
