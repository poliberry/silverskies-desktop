name: Release

# Push a tag matching v* (keep it in sync with the workspace version in
# Cargo.toml) to build all three platforms and publish a GitHub Release with
# every binary attached. `workflow_dispatch` re-runs the build manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: silverskies-windows-x86_64.zip
            bin: silverskies.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: silverskies-macos-arm64.tar.gz
            bin: silverskies
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: silverskies-macos-x86_64.tar.gz
            bin: silverskies
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: silverskies-linux-x86_64.tar.gz
            bin: silverskies
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      # eframe (glow/winit), cpal (rodio) and tts (speech-dispatcher) need
      # these system libraries on Linux.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev libasound2-dev \
            libspeechd-dev libssl-dev pkg-config

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p silverskies

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.bin }} dist/
          Copy-Item -Recurse assets dist/assets
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/
          cp -r assets dist/assets
          cp README.md dist/
          tar -czf ${{ matrix.artifact }} -C dist .

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ${{ matrix.artifact }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
