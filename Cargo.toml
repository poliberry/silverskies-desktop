[workspace]
resolver = "2"
members = [
    "crates/ss-core",
    "crates/ss-net",
    "crates/ss-store",
    "crates/ss-audio",
    "crates/ss-map",
    "crates/silverskies",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/poliberry/silverskies-desktop"

[workspace.dependencies]
ss-core = { path = "crates/ss-core" }
ss-net = { path = "crates/ss-net" }
ss-store = { path = "crates/ss-store" }
ss-audio = { path = "crates/ss-audio" }
ss-map = { path = "crates/ss-map" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
regex = "1"
once_cell = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip", "stream"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
resvg = { version = "0.49", default-features = false }
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg"] }
earcutr = "0.5"
directories = "6"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
